# The dashboard's own server. The app is static files; everything Django
# owns (API, admin, admin's static files) is proxied to the web container.
server {
    listen 80;

    location /api/ {
        proxy_pass http://web:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # /api/focus/stream is server-sent events: no buffering, no idle timeout.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 1d;
    }

    location /admin/ {
        proxy_pass http://web:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /static/ {
        proxy_pass http://web:8003;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        # The page itself is revalidated on every load: on 2026-10-28 Guy's browser kept
        # an index.html from before a rebuild and showed the old bundle for an hour.
        # The bundles it names carry a content hash, so they are safe to keep.
        location = /index.html { add_header Cache-Control "no-cache"; }
        location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    }
}
