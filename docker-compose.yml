# The whole stack, on whichever machine runs it (the Mac, or the host of
# docs/ops/HOST.md): db + migrate + scheduler + web (Django) + dashboard
# (nginx serving the React build, proxying /api, /admin and /static to web).
# restart: always brings everything back with Docker after a reboot. Ports
# on the machine, its own address only: 5435 Postgres (on the Mac 5432 is the
# organism's, 5433 the investment engine's, 5434 the conflict map's), 8003
# dashboard; Django is reached only through it. On a host the private
# network's proxy hands 8003 on; nothing here listens to any other address.
x-app: &app
  build: .
  env_file: .env
  # Without this only db and dashboard came back: the Mac rebooted on
  # 2026-11-02 23:47 and no job ran until the stack was started by hand on 11-05.
  restart: always
  environment:
    DB_HOST: db          # in-network address; .env's localhost:5435 is for host runs
    DB_PORT: "5432"
    DJANGO_DEBUG: "false"
    CLAUDE_CONFIG_DIR: /root/.claude
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    container_name: golaiet-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-golaiet}
      POSTGRES_USER: ${DB_USER:-golaiet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-golaiet} -d ${DB_NAME:-golaiet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "false"
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  scheduler:
    <<: *app
    container_name: golaiet-scheduler
    command: python manage.py run_scheduler
    volumes:
      - claude_state:/root/.claude   # CLI session store; --resume survives container recreation
      # The vault, for add_note alone; no other service sees it. Unset, an empty folder is mounted
      # and the tool refuses for want of the lane's file.
      - ${VAULT_HOST_DIR:-./logs/no-vault}:/vault
      # Where the database's dumps go (the nightly job, backup_db). Outside the working copy unless
      # .env says otherwise: the repo is public, and a dump inside it is one `git add` away from it.
      - ${BACKUP_HOST_DIR:-~/Backups/golaiet}:/backups
    environment:   # the app's own, repeated: a service's environment replaces the anchor's, it does not add to it
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "false"
      CLAUDE_CONFIG_DIR: /root/.claude
      VAULT_DIR: /vault
      BACKUP_DIR: /backups

  web:
    <<: *app
    container_name: golaiet-web
    # Threaded workers: the dashboard holds /api/focus/stream open, and a sync
    # worker would be parked on it for as long as the screen is on.
    command: gunicorn config.wsgi -b 0.0.0.0:8003 --workers 2 --worker-class gthread --threads 8

  dashboard:
    build: ./dashboard
    container_name: golaiet-dashboard
    restart: always
    ports:
      - "127.0.0.1:8003:80"
    depends_on:
      - web

volumes:
  pgdata:
  claude_state:
